# Optional overlay for hosts where an external reverse proxy reaches the app
# through a shared Docker network. Set PROXY_NETWORK to that network's name.
services:
  app:
    environment:
      # Only the proxy reaches this container, so its X-Forwarded-For is the visitor's
      # address: the sign-in log and the login rate limit see people, not the proxy.
      FORWARDED_ALLOW_IPS: "*"
    networks:
      default: {}
      proxy:
        aliases:
          - jobcraft

  # This host has 11 GB and few other tenants. A scan over ~19k vacancies with the
  # embedding child (1.8 GB) started beside it was killed at the shared-host 3 GB on
  # 2026-11-06, which to the app looks like a restart and loses the hours it ran.
  worker:
    mem_limit: 5120m

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-azuracast_default}
