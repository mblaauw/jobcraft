# Optional overlay for hosts where an external reverse proxy reaches the app
# through a shared Docker network. Set PROXY_NETWORK to that network's name.
services:
  app:
    environment:
      # Only the proxy reaches this container, so its X-Forwarded-For is the visitor's
      # address: the sign-in log and the login rate limit see people, not the proxy.
      FORWARDED_ALLOW_IPS: "*"
    networks:
      default: {}
      proxy:
        aliases:
          - jobcraft

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-azuracast_default}
