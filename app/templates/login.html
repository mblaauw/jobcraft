<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inloggen · Jobcraft</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <style>
    body.auth-page { display: block; padding-left: 0; }
    .auth-shell { max-width: 460px; margin: 0 auto; padding: 12vh 24px 48px; min-width: 0; }
    .auth-card { padding: 32px; }
    .auth-card h1 { margin-bottom: 6px; }
    .auth-form { display: grid; gap: 6px; margin-top: 22px; }
    .auth-form label { display: block; font-size: 12px; font-weight: 600; }
    .auth-form input[type="text"], .auth-form input[type="password"] {
      width: 100%; min-width: 0; min-height: 44px; padding: 10px 12px;
      border: 1px solid var(--line); border-radius: 8px; background: #f8faf8;
      color: var(--ink); font: inherit; font-size: 14px;
    }
    .auth-form input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; background: #fff; }
    .auth-form .button { margin-top: 14px; width: 100%; }
    .auth-foot { margin: 18px 0 0; }
  </style>
</head>
<body class="auth-page">
  <main class="auth-shell" id="main-content" tabindex="-1">
    <section class="card auth-card" aria-labelledby="login-title">
      <p class="eyebrow">Jobcraft</p>
      <h1 id="login-title">Inloggen</h1>
      <p class="sub">Deze werkruimte is persoonlijk. Log in met je eigen account.</p>

      {% if error %}<p class="banner warn" role="alert">{{ error }}</p>{% endif %}
      {% if notice %}<p class="banner ok">{{ notice }}</p>{% endif %}

      <form method="post" action="/login" class="auth-form">
        {{ csrf_input(request) }}
        <input type="hidden" name="next" value="{{ next_url or '' }}">
        <label for="username">Gebruikersnaam</label>
        <input id="username" name="username" type="text" value="{{ username or '' }}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
        <label for="password">Wachtwoord</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="button primary" type="submit">Inloggen</button>
      </form>

      <p class="small muted auth-foot">Er is geen openbare registratie: een beheerder maakt accounts aan en deelt het wachtwoord persoonlijk.</p>
    </section>
  </main>
</body>
</html>
