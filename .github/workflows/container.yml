name: Container

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose.yaml
      - docker/**
      - pyproject.toml
      - uv.lock
      - scripts/container_smoke.sh
      - .github/workflows/container.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/container_smoke.sh
