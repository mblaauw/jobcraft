# Employer registry: one line per employer. Only public job-board APIs, no login.
# Verified 2026-11-01: the board answered and listed vacancies in the Netherlands.
# Add an employer with: {name, system, slug}. Systems: greenhouse, recruitee, lever,
# personio, homerun, teamtailor.
# Personio also takes tld (com or de, default com): use the one whose /xml and /job/<id>
# answer without a redirect, and optionally detail_cap (job pages per round, default 40).
# Teamtailor also takes host, for a board on the employer's own domain. Homerun and
# Teamtailor list job pages in /sitemap.xml; each page has JobPosting JSON-LD, and
# vacancies outside the Netherlands are left out after reading the page.
