    enabled: true
    notes: "Recon 2026-11-06: ~190 vacatures met JSON-LD (onderdelen als Mentrum als werkgever), zonder plaats; Amsterdam is de standaard. Disclaimer van arkin.nl: verveelvoudigen alleen met schriftelijke toestemming. PoC, afspraak nodig."

  - id: omring
    scope: regional
    regions: [Hoorn]
    name: Omring (zorg, West-Friesland)
    kind: sitemap-jsonld
    revision: 2
    base_url: https://www.werkenbijomring.nl
    sitemap_url: https://www.werkenbijomring.nl/sitemap.xml
    url_pattern: "/vacatures/[0-9]+-[^/]+$"
    per_page: 550
    enabled: true
    notes: "Recon 2026-11-06: ~450 vacatures met JSON-LD. Disclaimer van omring.nl: niets mag worden verveelvoudigd of opgeslagen. PoC, afspraak nodig."

  - id: radboudumc
    scope: regional
    regions: [Nijmegen]
    name: Radboudumc
    kind: sitemap-jsonld
    revision: 2
    base_url: https://www.werkenbijradboudumc.nl
    sitemap_url: https://www.werkenbijradboudumc.nl/sitemap.xml
    url_pattern: "/vacatures/.+-[0-9]+$"
    per_page: 150
    enabled: true
    notes: "Recon 2026-11-06: ~80 vacatures met JSON-LD. Disclaimer: niets mag worden verveelvoudigd of opgeslagen. PoC, afspraak nodig."

  - id: achmea
    name: Achmea
    kind: sitemap-jsonld
    revision: 2
    base_url: https://www.werkenbijachmea.nl
