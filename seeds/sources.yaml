    kind: sitemap-jsonld
    revision: 2
    base_url: https://werkenbij.amsterdamumc.org
    sitemap_url: https://werkenbij.amsterdamumc.org/sitemap.xml
    url_pattern: "/nl/vacatures/[a-z-]+/[a-z0-9-]+$"
    per_page: 200
    enabled: true
    notes: "Recon 2026-11-06: ~120 vacatures met JSON-LD en plaats. Geen voorwaarden op de vacaturesite gevonden."

  - id: arkin
    scope: regional
    regions: [Amsterdam]
    name: Arkin (ggz)
    kind: sitemap-jsonld
    revision: 2
    base_url: https://www.werkenbijarkin.nl
    sitemap_url: https://www.werkenbijarkin.nl/sitemap.vacancy.xml
    url_pattern: "/vacature/[0-9]+/"
    per_page: 250
