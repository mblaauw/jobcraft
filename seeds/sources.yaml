# Shared source catalogue. Regional defaults follow each account's home.
#
# Verified 2026-10-18 (adapter in parentheses):
#   greenjobs            Exenzo public API, ~294 jobs, lat/lon per job        (exenzo-json)
#   baneninhetgroen      HTML listing with Amsterdam filter + slug locations  (html-listing)
#   gemeentebanen        sitemap -> JobPosting JSON-LD on detail pages        (sitemap-jsonld)
#   colourfuljobs        sitemap -> JobPosting JSON-LD on detail pages        (sitemap-jsonld)
#   werkenbij-amsterdam  HTML listing (gemeente Amsterdam), paged             (html-listing)
#   vca-vacaturebank     WordPress RSS feed                                   (rss)
#   culturele-vacatures  WordPress REST                                       (wp-posts)
#   social-enterprise    WordPress REST (vacature CPT, body from page)        (wp-posts)
#   fondsen              HTML list + detail (WP REST is gone)                 (html-fondsen)
#
# Broad channels without a structured route (Indeed, LinkedIn, Nationale
# Vacaturebank, Jobbird, Intermediair, Werk.nl) stay manual until the
# import-by-URL feature lands; scraping them is against their terms/anti-bot.
#
# Edits here are copied to data/sources.yaml once; edit the data copy afterwards.
# Raising a source's `revision` re-applies its settings to existing installations
# (its on/off state stays as it is).
sources:
  - id: culturele-vacatures
    name: Culturele Vacatures
    kind: wp-posts
    base_url: https://www.culturele-vacatures.nl
    path: /wp-json/wp/v2/posts
    per_page: 30
    enabled: true
    notes: "Culturele en maatschappelijke vacatures; titel bevat vaak 'Organisatie: Functie'."

  - id: fondsen
    name: Fondsen.org vacatures
    kind: html-fondsen
    base_url: https://fondsen.org
    path: /vacatures/
    per_page: 150
    revision: 2
    enabled: true
    notes: "Maatschappelijke werkgevers; WP REST geeft sinds 17-10-2026 een 301/404, HTML-lijst + detailpagina's."

  - id: social-enterprise
    name: Social Enterprise NL vacatures
    kind: wp-posts
    base_url: https://social-enterprise.nl
    path: /wp-json/wp/v2/vacature
    per_page: 20
    content_from_page: true
    enabled: true
    notes: "Vacature CPT; REST body is leeg, inhoud komt van de vacaturepagina."

  - id: greenjobs
    scope: national
    regions: []
    name: Greenjobs.nl (Exenzo API)
    kind: exenzo-json
    base_url: https://greenjobs.api.exenzo.com
    path: /api/public/v1/jobs
    public_site: https://greenjobs.nl
    per_page: 100
    max_pages: 4
    search: ""
    enrich_details: true
    detail_cap: 60
    revision: 2
    enabled: true
    notes: "Duurzame/groene vacaturebank met coördinaten (lat/lon) per vacature. Landelijk sinds 2026-11-05 (268 vacatures; met search=Amsterdam waren het er 45): het reisbereik verbergt wat te ver is. De API kapt teksten af op 300 tekens; de publieke vacaturepagina (geen robots.txt, JobPosting JSON-LD met 5.000+ tekens) vult ze aan, 60 per ronde, elke pagina hooguit eens per twee weken. Publieke URL: greenjobs.nl/vacature/{slug}. Andere borden op *.api.exenzo.com geprobeerd (techniek, zorg, bouw, horeca e.d.): allemaal 404."

  - id: baneninhetgroen
    scope: regional
    regions: [Amsterdam]
    name: Banen in het Groen (Amsterdam)
    kind: html-listing
    revision: 3
    site_name: Baneninhetgroen
    base_url: https://www.baneninhetgroen.nl
    listing_url: "https://www.baneninhetgroen.nl/vacatures?filter-location=Amsterdam%2C+Nederland"
    link_pattern: "/vacatures/[a-z0-9-]{4,}$"
    location_from_slug: "-in-([a-z-]+?)(?:-[0-9]+)?$"
    per_page: 30
    enabled: true
    notes: "Groene vacatures met Amsterdam-filter; de plaats staat vaak in de slug (…-in-{plaats})."

  - id: gemeentebanen
    name: Gemeentebanen.nl (publieke sector)
    kind: sitemap-jsonld
    base_url: https://www.gemeentebanen.nl
    sitemap_url: https://www.gemeentebanen.nl/sitemap.xml
    child_pattern: vacanc
    url_pattern: "/vacatures/[0-9]+/"
    per_page: 700
    revision: 2
    enabled: true
    notes: "Vacatures bij gemeenten en publieke organisaties; detailpagina's hebben schema.org JobPosting met locatie."

  - id: colourfuljobs
    name: Colourful Jobs (maatschappelijk)
    kind: sitemap-jsonld
    base_url: https://www.colourfuljobs.nl
    sitemap_url: https://www.colourfuljobs.nl/sitemap.xml
    url_pattern: "/vacatures/[a-z0-9-]+$"
    per_page: 40
    enabled: true
    notes: "Inclusieve/maatschappelijke werkgevers; detailpagina's met JobPosting JSON-LD."

  - id: werkenbij-amsterdam
    scope: regional
    regions: [Amsterdam]
    name: Werken bij Amsterdam (gemeente)
    kind: html-listing
    base_url: https://werkenbij.amsterdam.nl
    listing_url: "https://werkenbij.amsterdam.nl/vacatures?pageNumber={page}"
    pages: 3
    link_pattern: "/vacatures/[a-z0-9-]{4,}$"
    default_location: Amsterdam
    default_company: Gemeente Amsterdam
    revision: 2
    per_page: 50
    enabled: true
    notes: "Gemeentelijke vacatures (groen, facilitair, openbare ruimte, ondersteuning); geen JSON-LD, dus h1 + paginatekst."

  - id: vca-vacaturebank
    scope: regional
    regions: [Amsterdam]
    name: VCA Amsterdam vacaturebank
    kind: rss
    base_url: https://vacaturebank.vca.nu
    feed_url: https://vacaturebank.vca.nu/feed/
    per_page: 20
    enabled: true
    notes: "Kleine feed (vrijwilligers/community); nuttig als netwerk- en ervaringsroute."

  - id: amsterdamsebos
    scope: regional
    regions: [Amsterdam]
    name: Amsterdamse Bos
    kind: html-listing
    base_url: https://www.amsterdamsebos.nl
    listing_url: https://www.amsterdamsebos.nl/vacatures/
    link_pattern: "/vacatures/[a-z0-9-]{4,}$"
    per_page: 15
    enabled: false
    notes: "Geen WP REST/feed gevonden (2026-10-18); HTML-patroon nog niet geverifieerd — aanzetten na controle."

  - id: sustainablejobs
    name: SustainableJobs
    kind: sitemap-jsonld
    base_url: https://sustainablejobs.nl
    sitemap_url: https://sustainablejobs.nl/sitemap.xml
    url_pattern: "/vacatures/[a-z0-9-]+$"
    per_page: 30
    enabled: false
    notes: "Detailpagina's bevatten (nog) geen JobPosting JSON-LD; sitemap bevat vooral freelance/nieuws. Later opnieuw bekijken."

  - id: impactjobs-doen
    name: DOEN Impact Jobs
    kind: getro-html
    base_url: https://impactjobs.doen.nl
    path: /jobs
    detail_cap: 40
    recheck: 60
    delay: 1.0
    revision: 2
    enabled: true
    notes: "Getro-board (141 impactvacatures op 2026-11-05). De zoek-API van Getro (api.getro.com) verbiedt alle crawlers in robots.txt, dus alleen de eigen pagina's: /jobs geeft de 20 nieuwste in __NEXT_DATA__, elke vacaturepagina de volledige vacature (tekst, plaatsen, status). Wat van de lijst valt, wordt via de eigen pagina opnieuw gelezen zolang het actief is. robots.txt van het bord: geen regels voor *; 1 seconde tussen pagina's, hooguit 40 per ronde."

  - id: ivn
    name: IVN Natuureducatie
    kind: html-listing
    base_url: https://www.ivn.nl
    listing_url: https://www.ivn.nl/werken-bij-ivn/vacatures/
    link_pattern: "/afdeling/[a-z-]+/werken-bij-ivn/vacatures/[a-z0-9-]{4,}$"
    per_page: 10
    enabled: false
    notes: "Vooral vrijwilligersrollen door het hele land; handmatig bekijken, niet als primaire inkomensbron."

  - id: nationalevacaturebank
    name: Nationale Vacaturebank (handmatig)
    kind: manual
    base_url: https://www.nationalevacaturebank.nl
    enabled: false
    notes: "JS/anti-bot; handmatig zoeken of via import-by-URL toen die functie bestaat."

  - id: jobbird
    name: Jobbird (handmatig)
    kind: manual
    base_url: https://www.jobbird.com
    enabled: false
    notes: "Nuxt-SPA zonder publieke feed; handmatig."

  - id: indeed
    name: Indeed (handmatig)
    kind: manual
    base_url: https://nl.indeed.com
    enabled: false
    notes: "Recon 2026-10-26: robots.txt staat /job/ en /jobs/ disallowed; geen publieke feed/API gevonden. Vereist account en anti-bot. Alleen browser-import of handmatige import. Kandidaat voor een toekomstige authenticated connector met admin-entered credentials, mits ToS en robots dat toestaan."

  - id: defensie-civilian
    name: Defensie (burgerfuncties)
    kind: defensie-cms
    feed_url: https://werkenbijdefensie.nl/api/v1/feed/xml/nl_NL/dynamic-creatives-civilian
    per_page: 350
    revision: 2
    enrich_details: true
    enabled: true
    notes: "Alleen niet-militaire functies (feed dynamic-creatives-civilian: 294 items op 18-10-2026). Inhoud via de publieke CMS-API: routing/route?href=<vacature> -> component/component -> VacancyJobDescriptionParagraph.body. De feed levert salaris, vakantiedagen, rijbewijs-via-Defensie en organisatieonderdeel; locatie alleen als de detailcomponenten die noemen."

  - id: waterschappen
    name: Waterschappen (landelijk)
    kind: html-listing
    base_url: https://www.waterschappen.nl
    listing_url: https://waterschappen.nl/vacatures/
    link_pattern: "^https?://(?!(?:www\\.)?waterschappen\\.nl)[a-z0-9.-]+/(?:[a-z0-9-]+/)*vacatures/[a-z0-9-]{4,}"
    per_page: 120
    revision: 2
    company_from_host: true
    enabled: true
    notes: "Aggregator: links wijzen naar de vacaturepagina's van de individuele waterschappen (Amsterdamse regio: AGV, Waternet). Detailtekst komt van de lidpagina."

  - id: rijksoverheid
    name: Werken bij de Overheid (Rijk)
    kind: hn-resource
    base_url: https://www.werkenbijdeoverheid.nl
    path: /vacatures
    pages: 2
    per_page: 20
    enabled: true
    notes: "Lijst via de component-resource (_hn:type=resource&_hn:rid=vacancy-results; de ref wordt automatisch herontdekt uit de shell), paginering met &pagina=N. Detailpagina's zijn server-rendered en bevatten de volledige tekst (Dit ga je doen / Dit vragen wij). Dekt het Rijk: Rijkswaterstaat, ILT, Justis, Belastingdienst, DJI enzovoort."

  - id: werkenvoornederland
    name: Werken voor Nederland (Rijksoverheid)
    kind: sitemap-jsonld
    base_url: https://www.werkenvoornederland.nl
    sitemap_url: https://www.werkenvoornederland.nl/sitemap-vacatures.xml
    url_pattern: "/vacatures/[A-Za-z0-9-]+$"
    per_page: 1600
    revision: 2
    enabled: true
    notes: "Recon 2026-10-26: sitemap-vacatures.xml levert individuele vacature-URL's; detailpagina's bevatten schema.org JobPosting JSON-LD met titel, organisatie, locatie en beschrijving. Aanvulling op de rijksoverheid-bron; geen login nodig."

  - id: ats-platform
    name: ATS Platform (OLVG, Staatsbosbeheer, Zaanstad, ...) - client-id nodig
    kind: browser-import
    base_url: https://api.ats-platform.com
    enabled: false
    notes: "Gedeeld sollicitatieplatform achter de applicant-widget; api.ats-platform.com reageert maar vereist een client-id die niet in de paginamarkup staat. Zodra bekend: json-adapter voor meerdere publieke werkgevers tegelijk."

  - id: politie
    name: Politie (burgerfuncties) - browser-import nodig
    kind: browser-import
    base_url: https://www.werkenbijdepolitie.nl
    enabled: false
    notes: "Verbinding wordt gereset voor niet-browser clients (WAF, 18-10-2026). Alleen via browser-import."

  - id: brandweer-regio
    name: Brandweer / veiligheidsregio's - per regio
    kind: browser-import
    base_url: https://www.brandweer.nl
    enabled: false
    notes: "De landelijke sitemap bevat medewerkersverhalen, geen vacatures; elke veiligheidsregio heeft een eigen vacaturepagina (Amsterdam-Amstelland nog te vinden)."

  - id: handmatige-import
    name: Handmatige import uit JSON
    kind: local-json
    file: imports/handmatige-import.json
    per_page: 100
    enabled: false
    notes: "Leest data/imports/<bestand>.json met [{url,title,company,location,hours,description}], gevuld door scripts/browser_import.py of met de hand. Bedoeld voor bronnen die alleen via een browser te lezen zijn (ATS-platform van OLVG/Staatsbosbeheer/Zaanstad, Politie)."

  - id: ats-bedrijven
    name: Werkgevers met een eigen vacaturesysteem
    kind: ats-registry
    revision: 2
    enabled: true
    notes: "Publieke Greenhouse-, Recruitee-, Lever-, Personio-, Homerun- en Teamtailor-boards uit seeds/employers.yaml; alleen vacatures in Nederland. Ashby staat er niet tussen: robots.txt van de API geeft 401, en de scanner behandelt dat als niet toegestaan."

  - id: academictransfer
    name: AcademicTransfer (universiteiten en onderzoek)
    kind: sitemap-jsonld
    revision: 2
    base_url: https://www.academictransfer.com
    sitemap_url: https://www.academictransfer.com/sitemap-vacancies.xml
    url_pattern: "/jobs/[0-9]+/"
    per_page: 800
    enabled: true
    notes: "Recon 2026-11-01: robots staat vacaturepagina's toe met crawl-delay 10 (de scanner houdt zich daaraan, dus de eerste ronde duurt ongeveer 2 uur). 697 vacatures met JobPosting JSON-LD; geen kopieerbepaling gevonden in de gelinkte voorwaarden."

  - id: onderwijsvacatures
    name: Onderwijsvacatures
    kind: sitemap-jsonld
    revision: 3
    base_url: https://onderwijsvacatures.nl
    sitemap_url: https://onderwijsvacatures.nl/sitemap-vacatures.xml
    url_pattern: "/vacature"
    per_page: 100
    enabled: true
    notes: "Recon 2026-11-01: robots staat toe, maar artikel 7 van de voorwaarden houdt rechten op teksten en databestanden voor. Sinds 2026-11-06 aan als PoC (afspraak nodig); JSON-LD met plaats. Op een bestaande installatie zet een admin hem aan."

  # Proof of concept (2026-11-06): the owner chose to add these boards for own use
  # while agreements with the suppliers follow. Each note records the site's terms,
  # so those talks have a list. robots.txt, crawl-delay and pacing still apply.

  # Staffing agencies: large, mostly operational work; sitemap -> JobPosting JSON-LD.
  - id: randstad
    name: Randstad
    kind: sitemap-jsonld
    revision: 3
    base_url: https://www.randstad.nl
    sitemap_url: https://www.randstad.nl/job-sitemap.xml
    url_pattern: "/vacatures/[0-9]+/"
    per_page: 3500
    detail_cap: 600
    delay: 2
    enabled: true
    notes: "Recon 2026-11-06: ~2.900 vacatures, volledige JSON-LD met plaats en salaris. Voorwaarden: disclaimer verbiedt verveelvoudigen van de verzameling; gebruikersvoorwaarden verbieden vacatures zonder toestemming te herverkopen of aan derden te verstrekken. PoC, afspraak nodig."

  - id: randstad-professional
    name: Randstad Professional (vh. Yacht)
    kind: sitemap-jsonld
    revision: 3
    base_url: https://www.randstadprofessional.nl
    sitemap_url: https://www.randstadprofessional.nl/job-sitemap.xml
    url_pattern: "/vacatures/[0-9]+/"
    per_page: 800
    detail_cap: 600
    delay: 2
    enabled: true
    notes: "Recon 2026-11-06: ~550 hbo/wo-opdrachten en vacatures, JSON-LD met 3.000-5.000 tekens. Voorwaarden: zoals Randstad (databankrecht, geen verstrekking aan derden). PoC, afspraak nodig."

  - id: tempo-team
    name: Tempo-Team
    kind: sitemap-jsonld
    revision: 3
    base_url: https://www.tempo-team.nl
    sitemap_url: https://www.tempo-team.nl/job-sitemap.xml
    url_pattern: "/vacatures/[0-9]+/"
    per_page: 3500
    detail_cap: 600
    delay: 2
    enabled: false
    notes: "Recon 2026-11-06: ~2.900 vacatures, JSON-LD met plaats en salaris. Voorwaarden: verbieden vacatures zonder toestemming te herverkopen of te verstrekken; disclaimer verbiedt verveelvoudigen. PoC, afspraak nodig. Uit op 2026-11-07: de site geeft 403 op robots.txt, sitemap en elke pagina voor het serveradres, met elke user-agent; vanaf een thuisverbinding wel 200. Een IP-blokkade is een technische grens die blijft staan; recon voortaan ook vanaf de server doen. Om ~10:30 op 2026-11-07 gaf dezelfde server weer 200 op robots.txt, sitemap en 379 pagina's: een tijdelijke afknijping na een volle ronde van de Randstad-sites, geen vaste blokkade. Daarom nu hooguit 600 pagina's per ronde met 2 seconden ertussen; weer aanzetten is een keuze van de eigenaar."

  - id: unique
    name: Unique
    kind: sitemap-jsonld
    revision: 3
    base_url: https://www.unique.nl
    sitemap_url: https://www.unique.nl/sitemap.xml
    child_pattern: vacature
    url_pattern: "/vacature/[a-z0-9-]+-[0-9]+$"
    per_page: 1000
    detail_cap: 600
    delay: 2
    enabled: true
    notes: "Recon 2026-11-06: ~770 vacatures met JSON-LD. Voorwaarden (pdf 2021): opslaan, verzamelen en verveelvoudigen alleen met schriftelijke toestemming. PoC, afspraak nodig."

  - id: manpower
    name: Manpower
    kind: sitemap-jsonld
    revision: 3
    base_url: https://www.manpower.nl
    sitemap_url: https://www.manpower.nl/sitemap.xml
    url_pattern: "/nl/vacatures/[0-9]+/"
    per_page: 1400
    detail_cap: 600
    delay: 2
    enabled: true
    notes: "Recon 2026-11-06: ~1.220 vacatures (de Engelse /en/jobs-kopie wordt overgeslagen). JSON-LD heeft maar een korte samenvatting; de tekst komt van de pagina. Voorwaarden niet nagelezen. PoC."

  - id: timing
    name: Timing
    kind: sitemap-jsonld
    revision: 3
    base_url: https://www.timing.nl
    sitemap_url: https://www.timing.nl/sitemap/vacature/sitemap.xml
    url_pattern: "/vacature/"
    per_page: 1700
    detail_cap: 600
    delay: 2
    enabled: true
    notes: "Recon 2026-11-06: ~1.500 vacatures (vooral logistiek en productie), JSON-LD met plaats. Algemene voorwaarden: geen kopieerbepaling gevonden."

  - id: brunel
    name: Brunel
    kind: sitemap-jsonld
    revision: 3
    base_url: https://www.brunel.net
    sitemap_url: https://www.brunel.net/nl-nl/sitemap-jobs.xml
    url_pattern: "/nl-nl/jobs/"
    per_page: 1100
    detail_cap: 600
    delay: 2
    enabled: true
    notes: "Recon 2026-11-06: ~930 vacatures in de Nederlandse sitemap (techniek, IT, juridisch), JSON-LD; niet elke vacature heeft een plaats. Algemene voorwaarden (pdf) gaan over opdrachten, geen kopieerbepaling op de site gevonden."

  - id: tmi
    name: TMI (zorg)
    kind: sitemap-jsonld
    revision: 2
    base_url: https://www.tmi.nl
    sitemap_url: https://www.tmi.nl/vacancy-sitemap.xml
    url_pattern: "/vacatures/[a-z0-9-]+/$"
    per_page: 700
    enabled: true
    notes: "Recon 2026-11-06: ~600 zorgvacatures met JSON-LD; robots vraagt crawl-delay 10, dus de eerste ronde duurt ongeveer 1,7 uur. Ook vacatures op de Caribische eilanden. Disclaimer: algemeen voorbehoud van intellectuele eigendom."

  - id: harveynash
    name: Harvey Nash
    kind: sitemap-jsonld
    revision: 2
    base_url: https://www.harveynash.nl
    sitemap_url: https://www.harveynash.nl/sitemap.xml
    url_pattern: "/vacatures/[0-9]+-"
    per_page: 100
    enabled: true
    notes: "Recon 2026-11-06: ~40 IT- en projectvacatures met volledige JSON-LD. Geen voorwaarden op de site gevonden."

  # Employers' own career sites: sitemap -> JobPosting JSON-LD.
  - id: werkenbij-ns
    name: NS
    kind: sitemap-jsonld
    revision: 2
    base_url: https://www.werkenbijns.nl
    sitemap_url: https://www.werkenbijns.nl/sitemap.xml
    url_pattern: "/vacatures/[a-z0-9-]+-[0-9]+$"
    per_page: 300
