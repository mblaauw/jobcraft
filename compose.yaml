services:
  app:
    build: .
    image: jobcraft:local
    # 18080 is deliberately outside AzuraCast's stream range (8000-8500) and bound
    # to loopback only: docker-published ports bypass UFW on the shared VPS.
    # Set JOBCRAFT_PORT in a .env file next to this one when that port is taken.
    ports:
      - "127.0.0.1:${JOBCRAFT_PORT:-18080}:8080"
    env_file:
      - .env.local
    environment:
      APP_ROLE: web
      APP_DATA_DIR: /data
      APP_RUNTIME_DIR: /data/runtime
      APP_SEED_DIR: /seed
    volumes:
      - ./data:/data
      - ./seed:/seed:ro
    restart: unless-stopped
    # Keep the co-hosted radio station safe from runaway LibreOffice/LLM work.
    mem_limit: 768m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Scans, assessments, documents and digests. Same image and data; the two together
  # stay within the 2 GB and 2 CPUs the shared host can spare. LibreOffice runs here.
  worker:
    image: jobcraft:local
    command: ["uv", "run", "--no-dev", "python", "-m", "app.worker"]
    depends_on:
      - app
    env_file:
      - .env.local
    environment:
      APP_ROLE: worker
      APP_DATA_DIR: /data
      APP_RUNTIME_DIR: /data/runtime
      APP_SEED_DIR: /seed
    volumes:
      - ./data:/data
      - ./seed:/seed:ro
    restart: unless-stopped
    stop_grace_period: 60s
    # 1.8 GB of this is the embedding model's short-lived child process (app/embed_child.py).
    mem_limit: 3072m
    cpus: 1.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
